<div class="min-h-screen bg-slate-50 px-6 py-16">
    <div class="mx-auto flex min-h-[70vh] max-w-4xl items-center justify-center">

        <div class="w-full text-center">

            <!-- 404 Illustration -->
            <div class="relative mx-auto mb-8 flex h-48 w-48 items-center justify-center">

                <!-- Background Circle -->
                <div class="absolute inset-0 rounded-full bg-indigo-50"></div>

                <!-- 404 -->
                <div class="relative">
                    <p class="text-7xl font-extrabold tracking-tight text-indigo-600">
                        404
                    </p>

                    <div class="mx-auto mt-2 h-1 w-16 rounded-full bg-indigo-200"></div>
                </div>

            </div>


            <!-- Heading -->
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
                Page not found
            </h1>


            <!-- Description -->
            <p class="mx-auto mt-4 max-w-lg text-base leading-7 text-slate-500">
                Sorry, we couldn't find the page you're looking for.
                The link may be broken or the page may have been moved.
            </p>


            <!-- Buttons -->
            <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">

                <!-- Home -->
                <a routerLink="/" class="inline-flex w-full items-center justify-center gap-2 rounded-xl
                 bg-indigo-600 px-6 py-3 text-sm font-semibold text-white
                 shadow-sm transition
                 hover:bg-indigo-700
                 focus:outline-none focus:ring-4 focus:ring-indigo-500/20
                 sm:w-auto">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l9-9 9 9M5 10v10h14V10M9 20v-6h6v6" />

                    </svg>

                    Back to Home
                </a>


                <!-- Go Back -->
                <button type="button" (click)="goBack()" class="inline-flex w-full items-center justify-center gap-2 rounded-xl
                 border border-slate-200 bg-white px-6 py-3
                 text-sm font-semibold text-slate-700
                 shadow-sm transition
                 hover:bg-slate-50
                 focus:outline-none focus:ring-4 focus:ring-slate-200
                 sm:w-auto">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />

                    </svg>

                    Go Back
                </button>

            </div>


            <!-- Brand -->
            <div class="mt-12">

                <div class="flex items-center justify-center gap-2">

                    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600">

                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />

                        </svg>

                    </div>

                    <span class="text-lg font-bold text-slate-900">
                        Short<span class="text-indigo-600">Link</span>
                    </span>

                </div>

                <p class="mt-3 text-sm text-slate-400">
                    Shorten links. Share smarter.
                </p>

            </div>

        </div>

    </div>
</div>
