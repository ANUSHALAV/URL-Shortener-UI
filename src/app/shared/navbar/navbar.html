<header class="sticky top-0 z-50 w-full bg-background/95 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 text-text-primary no-underline">
      <!-- Logo Icon -->
      <div class="flex h-9 w-9 items-center justify-center text-2xl">
        <i class="fa-solid fa-link" style="color:var(--color-text-muted)"></i>
      </div>

      <!-- Logo Text -->
      <span class="text-2xl font-bold tracking-tight">
        Short<span class="text-primary">Link</span>
      </span>
    </a>


    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-8 md:flex">
      <!-- Home -->
      <a routerLink="/"
        class="cursor-pointer text-sm font-medium text-primary no-underline transition-colors duration-200 hover:text-primary-dark">
        Home
      </a>


      <!-- About -->
      <a routerLink="/about"
        class="cursor-pointer text-sm font-medium text-text-primary no-underline transition-colors duration-200 hover:text-primary">
        About
      </a>

      <!-- Contact -->
      <a routerLink="/contact"
        class="cursor-pointer text-sm font-medium text-text-primary no-underline transition-colors duration-200 hover:text-primary">
        Contact
      </a>

    </nav>


    <!-- Mobile Menu Button -->
    <button type="button"
      class="flex h-10 w-10 flex-col items-center justify-center gap-1.5 rounded-lg border-0 bg-transparent p-2 md:hidden"
      (click)="toggleMenu()" aria-label="Toggle navigation">
      <span class="h-0.5 w-6 rounded-full bg-text-primary"></span>
      <span class="h-0.5 w-6 rounded-full bg-text-primary"></span>
      <span class="h-0.5 w-6 rounded-full bg-text-primary"></span>
    </button>
  </div>


  <!-- Mobile Navigation -->
  <nav class="mx-4 mb-4 flex flex-col gap-1 rounded-2xl border border-border-light bg-card p-3 shadow-lg md:hidden"
    [class.hidden]="!isMenuOpen">
    <a routerLink="/" (click)="closeMenu()"
      class="cursor-pointer rounded-xl px-4 py-3 text-sm font-medium text-primary no-underline hover:bg-primary-soft">
      Home
    </a>


    <a routerLink="/about" (click)="closeMenu()"
      class="cursor-pointer rounded-xl px-4 py-3 text-sm font-medium text-text-primary no-underline hover:bg-primary-soft hover:text-primary">
      About
    </a>

    <a routerLink="/contact" (click)="closeMenu()"
      class="cursor-pointer rounded-xl px-4 py-3 text-sm font-medium text-text-primary no-underline hover:bg-primary-soft hover:text-primary">
      Contact
    </a>

  </nav>

</header>
